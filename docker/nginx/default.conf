server {
    listen 80; # Nginx écoute sur le port 80 à l'intérieur de son conteneur
    server_name localhost;
    root /var/www/public; # Le dossier 'public' de Symfony où se trouve l'index.php

    location / {
        # Si le fichier demandé n'existe pas, on envoie tout vers index.php (le routeur de Symfony)
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # C'EST ICI QUE LA MAGIE DOCKER OPÈRE :
        # Au lieu d'une adresse IP, on utilise le nom du service "php" défini dans compose.yaml
        # Docker fait la résolution d'adresse tout seul entre les conteneurs.
        fastcgi_pass php:9000;
        
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # On interdit l'accès direct aux autres fichiers .php pour la sécurité
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}
