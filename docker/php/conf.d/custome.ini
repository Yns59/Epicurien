; ===================================
; Configuration PHP personnalisée
; ===================================

; --- Mémoire ---
memory_limit = 256M

; --- Upload de fichiers ---
upload_max_filesize = 64M
post_max_size = 64M

; --- Temps d'exécution ---
max_execution_time = 60

; --- Timezone ---
date.timezone = Europe/Paris

; --- Erreurs ---
display_errors = Off
log_errors = On

; --- Sécurité ---
expose_php = Off
